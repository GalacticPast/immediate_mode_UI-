<div id="rad-event-flow">
  <style>
    #rad-event-flow { display: grid; gap: 1rem; color: var(--foreground); }
    #rad-event-flow .controls { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
    #rad-event-flow .trace { display: grid; gap: .5rem; }
    #rad-event-flow .step { display: grid; grid-template-columns: 1.5rem 1fr; gap: .5rem; align-items: start; color: var(--muted-foreground); }
    #rad-event-flow .step.current { color: var(--foreground); font-weight: 500; }
    #rad-event-flow .step.current .number { background: var(--primary); color: var(--primary-foreground); }
    #rad-event-flow .number { display: inline-flex; width: 1.5rem; height: 1.5rem; align-items: center; justify-content: center; border-radius: 50%; background: var(--muted); color: var(--muted-foreground); }
    #rad-event-flow .detail { display: grid; gap: .4rem; }
    #rad-event-flow .buttons { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    #rad-event-flow a { overflow-wrap: anywhere; }
  </style>
  <div class="controls">
    <label class="form-check"><input class="form-check-input" id="rad-text-permission" type="checkbox" checked><span class="form-check-label">Text permission enabled</span></label>
    <label class="form-check"><input class="form-check-input" id="rad-focused" type="checkbox" checked><span class="form-check-label">Line edit has active focus</span></label>
  </div>
  <div class="trace" aria-label="Event flow">
    <div class="step" data-step="0"><span class="number">1</span><span>Text event enters the UI event list</span></div>
    <div class="step" data-step="1"><span class="number">2</span><span><code>ui_begin_build</code> receives the event list</span></div>
    <div class="step" data-step="2"><span class="number">3</span><span><code>ui_line_edit</code> checks active focus</span></div>
    <div class="step" data-step="3"><span class="number">4</span><span><code>ui_next_event</code> checks the current permission stack</span></div>
    <div class="step" data-step="4"><span class="number">5</span><span>Line edit processes a permitted text event</span></div>
    <div class="step" data-step="5"><span class="number">6</span><span><code>ui_eat_event</code> removes the handled event</span></div>
  </div>
  <div class="card detail" aria-live="polite"><strong id="rad-step-title"></strong><span id="rad-step-detail"></span><span id="rad-event-status"></span><a id="rad-source" target="_blank" rel="noopener noreferrer">View source</a></div>
  <div class="buttons"><button class="btn" id="rad-prev" type="button">Previous</button><button class="btn btn-primary" id="rad-next" type="button">Next</button><span id="rad-progress" class="text-small"></span></div>
  <script>
    (() => {
      const root = document.getElementById('rad-event-flow');
      const permission = root.querySelector('#rad-text-permission');
      const focused = root.querySelector('#rad-focused');
      const steps = Array.from(root.querySelectorAll('.step'));
      const title = root.querySelector('#rad-step-title');
      const detail = root.querySelector('#rad-step-detail');
      const status = root.querySelector('#rad-event-status');
      const source = root.querySelector('#rad-source');
      const previous = root.querySelector('#rad-prev');
      const next = root.querySelector('#rad-next');
      const progress = root.querySelector('#rad-progress');
      const saved = window.openai?.widgetState?.privateContent || {};
      let index = Number.isInteger(saved.index) ? Math.max(0, Math.min(5, saved.index)) : 0;
      permission.checked = typeof saved.permission === 'boolean' ? saved.permission : true;
      focused.checked = typeof saved.focused === 'boolean' ? saved.focused : true;
      const base = 'https://github.com/EpicGames/raddebugger/blob/master/';
      function render() {
        const stop = !focused.checked ? 2 : !permission.checked ? 3 : 5;
        index = Math.min(index, stop);
        const descriptions = [
          ['An event is queued', 'Example: a UI text event carries the string “a”.', 'src/ui/ui_core.h#L77-L168'],
          ['Build receives the list', 'The UI state stores the supplied event list for code running during the build.', 'src/ui/ui_core.c#L761-L765'],
          ['Check focus', focused.checked ? 'The line edit has active focus, so it iterates over events.' : 'The line edit is not actively focused, so its editing loop does not run.', 'src/ui/ui_basic_widgets.c#L202-L228'],
          ['Filter the event', permission.checked ? 'ui_next_event reads the top permission flags. Text is enabled, so this event can be returned.' : 'ui_next_event reads the top permission flags. Text is disabled, so it skips this event; the event stays in the list.', 'src/ui/ui_core.c#L470-L545'],
          ['Apply the edit', 'The line edit converts the event into a text operation and applies the change to its edit buffer.', 'src/ui/ui_basic_widgets.c#L223-L247'],
          ['Consume the event', 'After handling the event, the line edit calls ui_eat_event, which unlinks it from the list.', 'src/ui/ui_basic_widgets.c#L255-L264']
        ];
        steps.forEach((node, i) => { node.classList.toggle('current', i === index); node.hidden = i > stop; });
        title.textContent = descriptions[index][0];
        detail.textContent = descriptions[index][1];
        status.textContent = index === 5 ? 'Event list: event removed.' : 'Event list: event still present.';
        source.href = base + descriptions[index][2];
        progress.textContent = `Step ${index + 1} of ${stop + 1}`;
        previous.disabled = index === 0;
        next.disabled = index === stop;
      }
      function save() { window.openai?.setWidgetState?.({modelContent:{permission:permission.checked, focused:focused.checked, step:index + 1}, privateContent:{permission:permission.checked, focused:focused.checked, index}}).catch(() => {}); }
      previous.addEventListener('click', () => { index--; render(); save(); });
      next.addEventListener('click', () => { index++; render(); save(); });
      [permission, focused].forEach(control => control.addEventListener('change', () => { render(); save(); }));
      window.addEventListener('openai:set_globals', event => { const state = event.detail?.globals?.widgetState?.privateContent; if (!state) return; if (typeof state.permission === 'boolean') permission.checked = state.permission; if (typeof state.focused === 'boolean') focused.checked = state.focused; if (Number.isInteger(state.index)) index = Math.max(0, Math.min(5, state.index)); render(); });
      render();
    })();
  </script>
</div>
